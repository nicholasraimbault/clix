[package]
name = "clix"
version = "0.1.0"
edition = "2021"
description = "Owner-granted tools across your Linux machines, for you or your agent"
repository = "https://github.com/nicholasraimbault/clix"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clix"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hmac = "0.12"
ksni = "0.3"
nix = { version = "0.29", default-features = false, features = ["user"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
